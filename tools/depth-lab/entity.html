<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>碎光 · 实体最小联调</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05090b;color:#eaf5ef;font:16px system-ui,-apple-system,sans-serif}
#stage{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,#17352f 0,#081313 48%,#030607 100%)}#stage canvas{width:100%;height:100%;display:block}
#panel{position:fixed;top:24px;left:24px;width:min(380px,calc(100vw - 48px));padding:18px 20px;border:1px solid #35514a;border-radius:16px;background:rgba(8,17,18,.88);backdrop-filter:blur(10px)}
#panel h1{font-size:20px;font-weight:500;margin:0 0 4px}.eyebrow{color:#a8d5be;font-size:11px;letter-spacing:3px}.muted{color:#9eb4af;font-size:13px;line-height:1.55}.status{margin:14px 0;padding:10px 12px;border-left:3px solid #aee8bd;background:#142b25}.status.bad{border-color:#ffbf91;background:#2d201a}button{border:1px solid #4b6960;border-radius:9px;background:#182a29;color:#eefaf4;font:inherit;padding:9px 12px;cursor:pointer}button.primary{background:#c5edc8;color:#13251e;border:0}button:disabled{opacity:.45;cursor:default}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{font-size:13px;color:#b5c8c1;margin-right:12px}input{accent-color:#bde9c3}.metric{font-variant-numeric:tabular-nums;color:#c8ebce}.hidden{display:none}#minimal{position:fixed;right:24px;bottom:20px;color:#9eb4af;font-size:12px;opacity:.72}
</style>
<div id="stage"><canvas id="canvas" aria-label="碎光投影画布"></canvas></div>
<section id="panel"><div class="eyebrow">THE LIVING WALL / ENTITY BRIDGE</div><h1>碎光 · 实体最小联调</h1><p class="muted">实时深度 → 最大近墙区域 → 投影反应。此页面不请求浏览器摄像头。</p><div id="status" class="status">正在连接本地深度测试台…</div><div id="metric" class="metric">等待 Gemini 335 数据</div><div class="row"><button id="calibrate" class="primary" disabled>记住现在的空墙</button><button id="fullscreen">全屏投影</button></div><div class="row"><label><input id="flipX" type="checkbox"> 左右镜像</label><label><input id="flipY" type="checkbox"> 上下翻转</label><button id="hide">隐藏说明</button></div><p class="muted">测试顺序：空墙 → 手伸入 → 左右移动 → 停住 → 手移开。只取最大的近墙区域；这不是手部语义识别，也不是精确触摸测量。</p></section><div id="minimal">本机实体模式 · 无图像上传 · 无线上线</div>
<script>
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),statusEl=document.querySelector('#status'),metric=document.querySelector('#metric'),calibrate=document.querySelector('#calibrate'),flipX=document.querySelector('#flipX'),flipY=document.querySelector('#flipY');let point=null,lastTime=performance.now(),particles=[];
function resize(){const d=devicePixelRatio||1;canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);ctx.setTransform(d,0,0,d,0,0);if(!particles.length){for(let i=0;i<190;i++)particles.push({a:Math.random()*Math.PI*2,r:Math.random()*180+10,s:.2+Math.random()*.9,p:Math.random()*Math.PI*2})}}addEventListener('resize',resize);resize();
function post(path,data={}){return fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.error||'操作失败');return j})}
calibrate.onclick=()=>{calibrate.disabled=true;post('calibrate',{roi:[.2,.2,.8,.8]}).catch(e=>{statusEl.textContent=e.message;statusEl.classList.add('bad')})};document.querySelector('#fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();document.querySelector('#hide').onclick=()=>document.querySelector('#panel').classList.toggle('hidden');
function draw(now){const dt=Math.min(.05,(now-lastTime)/1000);lastTime=now;const w=innerWidth,h=innerHeight,breathe=.5+.5*Math.sin(now/900);ctx.clearRect(0,0,w,h);if(point){const px=flipX.checked?1-point[0]:point[0],py=flipY.checked?1-point[1]:point[1],x=px*w,y=py*h;ctx.save();ctx.globalCompositeOperation='lighter';for(let ring=0;ring<4;ring++){const radius=38+ring*24+breathe*12,g=ctx.createRadialGradient(x,y,0,x,y,radius);g.addColorStop(0,`rgba(210,255,221,${.22-ring*.035})`);g.addColorStop(1,'rgba(100,240,177,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill()}ctx.fillStyle='rgba(228,255,222,.92)';ctx.beginPath();ctx.arc(x,y,8+breathe*4,0,Math.PI*2);ctx.fill();for(const q of particles){const rr=q.r+breathe*8+Math.sin(now/1500+q.p)*4,ang=q.a+now/7000*q.s;ctx.fillStyle=`rgba(192,255,211,${.25+breathe*.45})`;ctx.fillRect(x+Math.cos(ang)*rr,y+Math.sin(ang)*rr*.72,2,2)}ctx.restore()}else{ctx.save();ctx.globalAlpha=.12+breathe*.08;ctx.strokeStyle='#bde9c3';ctx.lineWidth=2;ctx.beginPath();ctx.arc(w/2,h/2,55+breathe*8,0,Math.PI*2);ctx.stroke();ctx.restore()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('本地深度服务不可用');const d=await r.json(),s=d.result||{},fresh=d.age_ms!=null&&d.age_ms<=1500,valid=fresh&&s.diagnostic_valid&&s.background_model==='pixel-wall-v2',rs=valid?s.near_regions||[]:[],region=rs.length?rs.reduce((a,b)=>b.area_px>a.area_px?b:a):null;calibrate.disabled=!fresh||s.state==='calibrating';if(region){const [x,y]=region.center;point=point?[point[0]+(x-point[0])*.32,point[1]+(y-point[1])*.32]:[x,y];statusEl.textContent='已检测到近墙区域 · 碎光跟随中';statusEl.classList.remove('bad');metric.textContent=`位置 ${(x*100).toFixed(0)}% / ${(y*100).toFixed(0)}% · 表面间距约 ${region.gap_mm} mm`}else{point=null;const msg=!fresh?'等待实时深度数据':!s.diagnostic_valid?(s.message||'数据不可用于交互'):s.state==='calibrating'?'正在校准空墙':'空墙 / 等待手靠近';statusEl.textContent=msg;statusEl.classList.toggle('bad',!fresh||!s.diagnostic_valid);metric.textContent=`前景 ${s.regions?.length||0} · 近墙 ${s.near_regions?.length||0} · 帧龄 ${d.age_ms??'—'} ms`}}catch(e){point=null;statusEl.textContent=e.message;statusEl.classList.add('bad');metric.textContent='请先运行启动相机权限测试.command';calibrate.disabled=true}setTimeout(poll,120)}poll();
</script>
