<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小莹 · 声音库｜本地版</title>
<style>
:root{color-scheme:dark;font:15px/1.65 system-ui,sans-serif;color:#e6eee8;background:#101814}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:52px 24px 160px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:36px;letter-spacing:1px;margin:3px 0}h2{font-size:19px;margin:0}.eyebrow{color:#a9d9b5;letter-spacing:3px;font-size:12px}.muted,small{color:#99aaa0}.intro{margin:26px 0;color:#abbdb0;max-width:760px}.actions,.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,.button,input,select,textarea{font:inherit;border-radius:10px;border:1px solid #3a4c40;background:#202e25;color:inherit;padding:10px 15px}button,.button{cursor:pointer;text-decoration:none;display:inline-block}button:hover,.button:hover{border-color:#a6d7b3;background:#2b3d31}button:disabled{opacity:.45;cursor:wait}.primary{background:#bcdfbd;color:#132119;border-color:#bcdfbd}.drop{display:block;border:1px dashed #688c71;background:#18271e;border-radius:18px;text-align:center;padding:32px;margin:25px 0;cursor:pointer}.drop.over{background:#2d4835}.drop strong{display:block;font-size:18px;color:#d1ecd4}.filters{margin:26px 0}.filters input{flex:1;min-width:180px}.card{display:grid;grid-template-columns:48px 1fr auto;gap:18px;align-items:center;border-top:1px solid #2e3e33;padding:24px 0}.play{border-radius:50%;width:46px;height:46px;padding:0}.card h2{overflow-wrap:anywhere}.meta{font-size:12px;color:#a4b6a9;margin-top:6px}.note{white-space:pre-wrap;color:#bbc9be;font-size:14px;margin-top:8px;overflow-wrap:anywhere}.empty{text-align:center;padding:58px 15px;border:1px solid #2c3f31;border-radius:16px;color:#a9bcad}.empty strong{display:block;color:#dce9de;font-size:20px;margin-bottom:12px}#status{padding:12px 0;min-height:45px;color:#bde0c4}footer{position:fixed;bottom:0;left:0;right:0;background:#1c2b22ee;backdrop-filter:blur(16px);border-top:1px solid #3a4b3f;padding:16px 24px;display:flex;justify-content:center;gap:24px;align-items:center}#now{max-width:350px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}audio{width:min(520px,60vw)}dialog{color:inherit;background:#17241b;border:1px solid #536c59;border-radius:18px;width:min(540px,94vw);padding:28px}dialog::backdrop{background:#0009}form label{display:block;margin:16px 0}form input,form select,form textarea{display:block;width:100%;margin-top:6px}textarea{min-height:100px;resize:vertical}a{color:#bdddc3}.hint{font-size:13px;color:#91a397}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #c4ebce;outline-offset:3px}@media(max-width:640px){main{padding:28px 18px 170px}h1{font-size:29px}.card{grid-template-columns:44px 1fr;gap:12px}.card>.actions{grid-column:2}footer{display:block}#now{margin:0 auto 8px;max-width:100%}audio{width:100%}.filters select{width:100%}}
</style>
<main>
<header><div><div class="eyebrow">THE LIVING WALL · SOUND ARCHIVE</div><h1>小莹 · 声音库</h1><div class="muted">本地版 · 每个人都可以上传和编辑</div></div><div class="actions"><button id="export">导出全部备份</button><button id="import">导入备份</button></div></header>
<p class="intro">把零散的声音，慢慢整理成小莹的语言。收藏、试听，记录每一段声音属于哪个阶段，以及下一步想怎样修改。</p>
<label class="drop" id="drop"><strong>＋ 点击选择音频，或拖到这里</strong><span class="muted">MP3 / WAV / M4A / AAC / OGG / FLAC / WEBM · 单个最大 30 MB</span><input id="files" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac,.webm" multiple hidden></label>
<p class="hint">音频保存在当前浏览器。分享给别人时，请发送本地版文件夹和“导出全部备份”生成的文件。此版本不自动同步线上声音库。</p>
<div id="status" role="status" aria-live="polite">正在打开本地声音库…</div>
<div class="filters"><input id="search" type="search" aria-label="搜索声音" placeholder="搜索名字、原文件名或备注"><select id="typeFilter" aria-label="声音类型"></select><select id="stageFilter" aria-label="声音阶段"></select><span id="count" class="muted"></span></div>
<section id="list" aria-label="声音列表"></section>
<p class="hint">本地包不含线上已有的 6 段音频原件；重新上传同名原文件时，会自动带入已整理的名称、分类和备注。请定期导出备份，清理浏览器数据会清空本地库。</p>
<p class="hint"><a href="https://xiaoying-sound-library.youyou0213bann.chatgpt.site" target="_blank" rel="noopener">打开线上声音库 ↗</a></p>
</main>
<footer><div id="now">选择一段声音，开始试听</div><audio id="player" controls preload="metadata"></audio></footer>
<dialog id="edit"><form id="editForm"><h2>整理声音</h2><label>名称<input id="editName" required maxlength="150"></label><label>声音类型<select id="editType"></select></label><label>所属阶段<select id="editStage"></select></label><label>修改想法 / 备注<textarea id="editNote" maxlength="5000"></textarea></label><div class="actions"><button class="primary" type="submit">保存修改</button><button id="cancel" type="button">取消</button></div></form></dialog>
<input id="backupFile" type="file" accept=".json,application/json" hidden>
<script>
'use strict';
const TYPES=['未分类','鳞片 / 碎片','空气 / 波纹','核心 / 小语言','呼吸','音乐参考'];
const STAGES=['未分配','① 独处','② 注意与试探','③ 初次触碰','④ 持续亲近','⑤ 结束与休息','⑥ 受惊与恢复'];
const CATALOG=[
{original:'695630__sadiquecat__female-cat-purr.mp3',name:'呼噜声',type:'呼吸',stage:'⑤ 结束与休息',note:'呼吸速度太快了，不柔和，需要降速和柔和处理，现在显得很急躁'},
{original:'578799__nomiqbomi__rattle-4.mp3',name:'触碰音',type:'空气 / 波纹',stage:'③ 初次触碰',note:''},
{original:'770077__tanweraman__snake-rattle-sound-hq.wav',name:'鳞片声',type:'音乐参考',stage:'② 注意与试探',note:'太快了需要改慢'},
{original:'alex_jauk-my-dreamy-place-kalimba-song-460952.mp3',name:'背景音乐-铺垫在底下',type:'未分类',stage:'未分配',note:''},
{original:'249706__brunoboselli__3-egg-shaker-rolls.wav',name:'鳞片声',type:'鳞片 / 碎片',stage:'④ 持续亲近',note:''},
{original:'469066__hawkeye_sprout__cute-creature-01.wav',name:'抚摸声',type:'核心 / 小语言',stage:'③ 初次触碰',note:'需要修改的是声音的尾巴在延续长一点'}];
const $=id=>document.getElementById(id), MAX=30*1024*1024;
let db,rows=[],editing=null,playing=null,playUrl=null,busy=false;
const status=t=>$('status').textContent=t;
function options(id,values,all){const el=$(id);if(all)el.add(new Option(all,''));values.forEach(v=>el.add(new Option(v,v)));}
options('typeFilter',TYPES,'所有类型');options('stageFilter',STAGES,'所有阶段');options('editType',TYPES);options('editStage',STAGES);
function node(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el;}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);}
function transact(mode,operation){return new Promise((resolve,reject)=>{const tx=db.transaction('sounds',mode);let value;try{value=operation(tx.objectStore('sounds'));}catch(e){tx.abort();reject(e);return;}tx.oncomplete=()=>resolve(value&&'result' in value?value.result:value);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('保存已取消'));});}
async function refresh(){rows=await transact('readonly',s=>s.getAll());rows.sort((a,b)=>b.created.localeCompare(a.created));render();}
function render(){const q=$('search').value.toLowerCase(),type=$('typeFilter').value,stage=$('stageFilter').value;const filtered=rows.filter(r=>(!type||r.type===type)&&(!stage||r.stage===stage)&&[r.name,r.original,r.note].some(s=>s.toLowerCase().includes(q)));$('count').textContent=filtered.length+' / '+rows.length+' 段';$('list').replaceChildren();if(!filtered.length){const box=node('div','empty');box.append(node('strong','',rows.length?'没有匹配的声音':'声音库已准备好'),node('div','',rows.length?'试试其他分类或关键词。':'上传音频，或导入朋友发来的备份。'));$('list').append(box);return;}for(const r of filtered){const card=node('article','card'),play=node('button','play',playing===r.id?'♫':'▶');play.setAttribute('aria-label','试听 '+r.name);play.onclick=()=>listen(r);const info=node('div');info.append(node('h2','',r.name),node('div','meta',r.type+' · '+r.stage+' · '+(r.bytes/1024/1024).toFixed(2)+' MB'),node('div','meta',r.original));if(r.note)info.append(node('div','note',r.note));const actions=node('div','actions'),edit=node('button','','改名 / 编辑'),down=node('button','','下载');edit.onclick=()=>openEdit(r);down.onclick=()=>download(r.blob,downloadName(r));actions.append(edit,down);card.append(play,info,actions);$('list').append(card);}}
function downloadName(r){const ext=r.original.match(/\.[^.]+$/)?.[0]||'';return (r.name.toLowerCase().endsWith(ext.toLowerCase())?r.name:r.name+ext).replace(/[\\/:*?"<>|]/g,'_');}
function download(blob,name){const url=URL.createObjectURL(blob),a=node('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
async function listen(r){const p=$('player');p.pause();if(playUrl)URL.revokeObjectURL(playUrl);playUrl=URL.createObjectURL(r.blob);p.src=playUrl;playing=r.id;$('now').textContent=r.name;render();try{await p.play();}catch{status('浏览器无法播放这段音频，可下载后用其他播放器试听。');}}
function openEdit(r){if(busy)return;editing=r.id;$('editName').value=r.name;$('editType').value=r.type;$('editStage').value=r.stage;$('editNote').value=r.note;$('edit').showModal();}
async function run(fn){if(busy)return;if(!db){status('本地保存不可用，请用普通窗口的 Chrome 或 Edge 打开。');return;}busy=true;$('export').disabled=$('import').disabled=true;try{await fn();}catch(e){console.error(e);status('操作未完成：'+(e.message||'请检查浏览器可用空间，或先导出备份。'));}finally{busy=false;$('export').disabled=$('import').disabled=false;}}
$('editForm').onsubmit=e=>{e.preventDefault();run(async()=>{const r=rows.find(r=>r.id===editing);const name=$('editName').value.trim();if(!r||!name)throw new Error('请填写声音名称。');await transact('readwrite',s=>s.put({...r,name,type:$('editType').value,stage:$('editStage').value,note:$('editNote').value}));if(playing===r.id)$('now').textContent=name;$('edit').close();await refresh();status('修改已保存在本地。');});};$('cancel').onclick=()=>$('edit').close();
const MIME={mp3:'audio/mpeg',wav:'audio/wav',m4a:'audio/mp4',aac:'audio/aac',ogg:'audio/ogg',flac:'audio/flac',webm:'audio/webm'};
async function upload(files){await run(async()=>{let added=0,skipped=0;for(const f of files){const ext=f.name.split('.').pop().toLowerCase();if(!MIME[ext]||!f.size||f.size>MAX){skipped++;continue;}const known=CATALOG.find(r=>r.original===f.name);const r={id:uid(),name:f.name.replace(/\.[^.]+$/,''),original:f.name,type:TYPES[0],stage:STAGES[0],note:'',...known,bytes:f.size,mime:MIME[ext],created:new Date().toISOString(),blob:f.slice(0,f.size,MIME[ext])};await transact('readwrite',s=>s.put(r));added++;}await refresh();status('已保存 '+added+' 段声音。'+(skipped?' 跳过 '+skipped+' 个空文件、超出 30 MB 或格式不支持的文件。':''));});}
$('files').onchange=async e=>{await upload([...e.target.files]);e.target.value='';};
for(const event of ['dragenter','dragover'])$('drop').addEventListener(event,e=>{e.preventDefault();$('drop').classList.add('over');});
for(const event of ['dragleave','drop'])$('drop').addEventListener(event,e=>{e.preventDefault();$('drop').classList.remove('over');});
$('drop').addEventListener('drop',e=>upload([...e.dataTransfer.files]));
window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());
for(const id of ['search','typeFilter','stageFilter'])$(id).addEventListener('input',render);
function dataURL(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob);});}
$('export').onclick=()=>run(async()=>{if(!rows.length){status('请先上传音频，再导出备份。');return;}if(rows.reduce((n,r)=>n+r.bytes,0)>150*1024*1024)throw new Error('音频总量超过本地备份的 150 MB 上限，请分别下载原件保存。');status('正在打包音频和备注，请稍候…');const sounds=[];for(const r of rows){const {blob,...meta}=r;sounds.push({...meta,audio:await dataURL(blob)});}download(new Blob([JSON.stringify({format:'xiaoying-sound-library',version:1,exportedAt:new Date().toISOString(),sounds})],{type:'application/json'}),'小莹声音库_完整备份_'+new Date().toISOString().slice(0,10)+'.json');status('已生成备份下载。把此文件和本地版文件夹一起发给朋友即可。');});
$('import').onclick=()=>$('backupFile').click();
function decodeSound(r){if(!r||typeof r.name!=='string'||!r.name.trim()||r.name.length>150||typeof r.original!=='string'||r.original.length>500||typeof r.note!=='string'||r.note.length>5000||!TYPES.includes(r.type)||!STAGES.includes(r.stage)||typeof r.audio!=='string')throw new Error('备份内容不完整或格式不正确。');const match=r.audio.match(/^data:(audio\/[a-zA-Z0-9.+-]+);base64,([A-Za-z0-9+/]*={0,2})$/);if(!match||match[2].length>Math.ceil(MAX/3)*4)throw new Error('备份包含无效或过大的音频。');const raw=atob(match[2]);if(!raw.length||raw.length>MAX)throw new Error('备份音频大小不符合要求。');const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));return {id:uid(),name:r.name,original:r.original,note:r.note,type:r.type,stage:r.stage,created:new Date().toISOString(),mime:match[1],bytes:bytes.length,blob:new Blob([bytes],{type:match[1]})};}
$('backupFile').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;await run(async()=>{if(file.size>210*1024*1024)throw new Error('备份文件过大，本地版仅支持不超过 210 MB 的备份文件。');status('正在读取备份…');const pack=JSON.parse(await file.text());if(pack.format!=='xiaoying-sound-library'||pack.version!==1||!Array.isArray(pack.sounds)||pack.sounds.length>2000)throw new Error('请选择本地声音库导出的 JSON 备份。');const imported=pack.sounds.map(decodeSound);if(imported.reduce((n,r)=>n+r.bytes,0)>150*1024*1024)throw new Error('备份音频总量超过 150 MB。');await transact('readwrite',s=>{for(const r of imported)s.add(r);});await refresh();status('已导入 '+imported.length+' 段声音和备注，原有内容已保留。重复导入会增加副本。');});};
try{const request=indexedDB.open('xiaoying-local-sounds',1);request.onupgradeneeded=()=>request.result.createObjectStore('sounds',{keyPath:'id'});request.onsuccess=async()=>{db=request.result;db.onversionchange=()=>db.close();try{await refresh();status('本地声音库已就绪 · 上传和修改均自动保存。');}catch{status('读取失败，请换用 Chrome 或 Edge 的普通窗口。');}};request.onerror=()=>status('无法打开本地保存空间，请使用 Chrome 或 Edge 的普通窗口。');request.onblocked=()=>status('请关闭其他本地声音库窗口后重新打开。');}catch{status('当前浏览器不支持本地保存，请使用 Chrome 或 Edge 的普通窗口。');}
</script>
</html>
