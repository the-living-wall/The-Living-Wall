# Template only: select an existing server and a dedicated HTTPS test origin first.
# Place limit_req_zone in the nginx http context, once.
limit_req_zone $binary_remote_addr zone=xiaoying_friends:1m rate=2r/s;
server {
    listen 443 ssl;
    server_name REPLACE_WITH_TEST_DOMAIN;
    ssl_certificate /REPLACE_WITH_CERTIFICATE_PATH;
    ssl_certificate_key /REPLACE_WITH_KEY_PATH;
    client_max_body_size 8k;
    # Avoid storing invite/visit metadata or credentials in test access logs.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:4190;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location /api/ {
        limit_req zone=xiaoying_friends burst=20 nodelay;
        proxy_pass http://127.0.0.1:4190;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }
}
